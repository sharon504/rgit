[package]
name = "main"
version = "0.1.0"
edition = "2024"

[lib]
name = "rgit_lib"
path = "src/lib.rs"

[[bin]]
name = "main"
path = "src/main.rs"

[dependencies]
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["derive"] }
rust-ini = "0.21.3"
sha-1 = "0.10.1"

[dev-dependencies]
tempfile = "3.8"
